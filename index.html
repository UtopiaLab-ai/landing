  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#0f0f0f" />

  <!-- §05 del manual: Helvetica para el wordmark y los datos, Bricolage para
       titulares, Fraunces itálica para las citas, JetBrains Mono para rótulos.
       Helvetica es propietaria y no se puede servir como webfont (va como stack
       de sistema, ver --font-sans); las otras tres se descargan acá. De
       Fraunces solo la itálica, que es el único corte que usa el sistema. -->
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Fraunces:ital,opsz,wght@1,9..144,300;1,9..144,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
