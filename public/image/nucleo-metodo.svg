<svg width="1640" height="980" viewBox="0 0 1640 980" xmlns="http://www.w3.org/2000/svg">
  <style>
    .mono, .sans { font-family: 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif; }
    text { fill: #0f0f0f; }
  </style>

  <rect x="0" y="0" width="1640" height="980" fill="#fafafa"/>
  <text x="60" y="56" class="mono" font-size="21" font-weight="700" letter-spacing="3" fill="#0f0f0f">EL NÚCLEO DEL MÉTODO</text>
  <text x="60" y="82" class="mono" font-size="12.5" letter-spacing="1.5" fill="#0f0f0f" fill-opacity="0.6">MM-14 · BIFURCACIÓN&#160;&#160;&#160;&#160;F-01 · CONO DE FUTUROS</text>
  <line x1="60" y1="98" x2="1580" y2="98" stroke="#ececec" stroke-width="1"/>

  <rect x="350" y="132" width="170" height="608" fill="#fbbe0b" opacity="0.07"/>
  <rect x="445" y="132" width="785" height="608" fill="#0b57a4" opacity="0.05"/>
  <rect x="1230" y="132" width="270" height="608" fill="#ef4a0f" opacity="0.045"/>

  <line x1="445" y1="150" x2="445" y2="740" stroke="#0b57a4" stroke-width="1.4" stroke-dasharray="4 5" opacity="0.8"/>
  <polygon points="445,740 445,650 1230,740" fill="#2e6b45" opacity="0.14"/>

  <line x1="150" y1="740" x2="150" y2="120" stroke="#0f0f0f" stroke-width="2"/>
  <polygon points="150,110 145,124 155,124" fill="#0f0f0f"/>
  <line x1="150" y1="740" x2="1512" y2="740" stroke="#0f0f0f" stroke-width="2"/>
  <polygon points="1522,740 1508,735 1508,745" fill="#0f0f0f"/>
  <text x="96" y="440" class="mono" font-size="13" fill="#0f0f0f" fill-opacity="0.6" transform="rotate(-90 96 440)" text-anchor="middle">intensidad / legibilidad de la señal</text>
  <text x="1500" y="768" class="moo" font-size="13" fill="#0f0f0f" fill-opacity="0.6" text-anchor="end">tiempo</text>

  <path d="M 150 738 C 200 725, 210 715, 250 705 C 340 685, 380 660, 445 630 C 520 596, 585 575, 655 545 C 760 500, 840 480, 905 455" fill="none" stroke="#0f0f0f" stroke-width="3"/>

  <path d="M 905 455 Q 1180 355 1500 258" fill="none" stroke="#2e6b45" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M 905 455 Q 1180 458 1500 468" fill="none" stroke="#2e6b45" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M 905 455 Q 1180 560 1500 648" fill="none" stroke="#2e6b45" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="1150" y="332" class="sans" font-size="12.5" font-style="italic" fill="#0f0f0f" text-anchor="middle">cono de futuros</text>
  <text x="1512" y="262" class="mono" font-size="13" fill="#0f0f0f">escenario A</text>
  <text x="1512" y="472" class="mono" font-size="13" fill="#0f0f0f">escenario B</text>
  <text x="1512" y="652" class="mono" font-size="13" fill="#0f0f0f">escenario C</text>

  <line x1="1230" y1="126" x2="1230" y2="740" stroke="#ef4a0f" stroke-width="2.5"/>
  <text x="1230" y="120" class="mono" font-size="14" font-weight="700" letter-spacing="1" fill="#0f0f0f" text-anchor="middle">PUNTO DE NO RETORNO</text>
  <text x="1244" y="166" class="sans" font-size="11.5" fill="#0f0f0f">efecto en curso</text>

  <circle cx="250" cy="705" r="7" fill="#6b675f"/>
  <text x="250" y="732" class="sans" font-size="13" fill="#0f0f0f" fill-opacity="0.6" text-anchor="middle">ruido</text>

  <circle cx="445" cy="630" r="8" fill="#0b57a4"/>
  <text x="445" y="663" class="sans" font-size="14" font-weight="600" fill="#0f0f0f" text-anchor="middle">señal débil</text>
  <text x="445" y="681" class="sans" font-size="11.5" fill="#0f0f0f" fill-opacity="0.6" text-anchor="middle">primero detectable · ambigua</text>

  <circle cx="655" cy="545" r="8" fill="#fbbe0b"/>
  <text x="648" y="507" class="sans" font-size="14" font-weight="600" fill="#0f0f0f" text-anchor="end">alerta · gatillo cruzado</text>
  <line x1="653" y1="514" x2="653" y2="534" stroke="#fbbe0b" stroke-width="1.2"/>

  <circle cx="905" cy="455" r="12" fill="#2e6b45"/>
  <circle cx="905" cy="455" r="17" fill="none" stroke="#2e6b45" stroke-width="1" opacity="0.4"/>
  <text x="886" y="437" class="sans" font-size="11.5" fill="#0f0f0f" fill-opacity="0.6" text-anchor="end">deja de haber un solo futuro</text>
  <text x="886" y="461" class="mono" font-size="17" font-weight="700" letter-spacing="1" fill="#0f0f0f" text-anchor="end">BIFURCACIÓN</text>

  <text x="435" y="172" class="sans" font-size="13.5" font-weight="600" fill="#0f0f0f" text-anchor="middle">umbral difuso</text>
  <text x="435" y="190" class="sans" font-size="11.5" fill="#0f0f0f" fill-opacity="0.6" text-anchor="middle">una zona, no un punto</text>

  <text x="837" y="166" class="sans" font-size="16" font-weight="700" fill="#0f0f0f" text-anchor="middle">ventana de decisión</text>
  <text x="837" y="185" class="sans" font-size="12" fill="#0f0f0f" fill-opacity="0.6" text-anchor="middle">aquí anticipar incide</text>
  <text x="452" y="734" class="mono" font-size="11" fill="#0f0f0f">se abre →</text>
  <text x="1224" y="734" class="mono" font-size="11" fill="#0f0f0f" text-anchor="end">← se cierra</text>
  <text x="470" y="716" class="sans" font-size="12" font-weight="600" fill="#0f0f0f">incidencia de la decisión:&#160;&#160;alta&#160;→&#160;nula</text>

  <line x1="445" y1="812" x2="1218" y2="812" stroke="#0b57a4" stroke-width="1.6"/>
  <polygon points="1230,812 1216,807 1216,817" fill="#0b57a4"/>
  <text x="837" y="800" class="sans" font-size="15.5" font-weight="600" fill="#0f0f0f" text-anchor="middle">anticipar = decidir dentro de la ventana, no predecir el escenario</text>
  <text x="837" y="838" class="sans" font-size="12" fill="#0f0f0f" fill-opacity="0.6" text-anchor="middle">detección temprana = margen&#160;&#160;·&#160;&#160;legibilidad tardía = menos palanca</text>
  <text x="1366" y="800" class="sans" font-size="12.5" font-weight="600" fill="#0f0f0f" text-anchor="middle">pasado el punto:</text>
  <text x="1366" y="820" class="sans" font-size="12.5" fill="#0f0f0f" text-anchor="middle">gestionar el efecto, no elegirlo</text>
</svg>
